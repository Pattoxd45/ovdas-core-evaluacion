---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-picking
  namespace: ovdas
  labels:
    app: worker-picking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-picking
  template:
    metadata:
      labels:
        app: worker-picking
    spec:
      initContainers:
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: worker-picking
          image: ovdas/worker-picking:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: ovdas-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
